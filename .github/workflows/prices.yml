# After every U.S. trading day: download each company's closing price,
# save it to src/data/prices.json on main, then rebuild and redeploy the site.
# Prices are only ever compared with an estimate; they never change one.
name: Update closing prices

on:
  schedule:
    # 21:45 UTC is 5:45 p.m. New York in summer and 4:45 p.m. in winter:
    # after the 4 p.m. close either way. Monday to Friday.
    - cron: '45 21 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: prices
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Download closing prices
        run: npm run data:prices

      - name: Save prices to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/prices.json
          if git diff --cached --quiet; then
            echo "Prices unchanged."
          else
            git commit -m "Update closing prices"
            git push origin HEAD:main
          fi

      - name: Check data, test and build
        run: |
          npm run check:data
          npm test
          npm run build

      - name: Deploy to GitHub Pages
        run: >
          npx gh-pages -d dist
          -m "Deploy with closing prices from ${{ github.run_id }}"
          -u "github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>"
          -r "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
